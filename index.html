<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🌀 IMAGI-WORLD: Neural Topology 🌀</title>
  <style>
    :root {
      --gold: linear-gradient(to right, #bf953f 0%, #fcf6ba 20%, #b38728 40%, #fbf5b7 60%, #aa771c 80%, #bf953f 100%);
      --bg: #010103;
      --panel: #0a0c10;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    body { 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
      background: var(--bg); color: #eee; min-height: 100vh; 
      display: flex; flex-direction: column; align-items: center; 
      padding: 10px; overflow-x: hidden; touch-action: manipulation;
    }

    /* SHINY STAR GOLD TITLE */
    h1 { 
      margin: 15px 0; font-size: clamp(1.8rem, 10vw, 3rem); text-align: center; 
      letter-spacing: 5px; font-weight: 900; background: var(--gold);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.9));
      text-transform: uppercase; animation: shimmer 6s infinite linear; background-size: 200% auto;
    }
    @keyframes shimmer { to { background-position: 200% center; } }

    .container { max-width: 500px; width: 100%; }

    .controls { 
      background: var(--panel); padding: 25px; border-radius: 20px; 
      margin-bottom: 15px; border: 1px solid #1a1a1a; box-shadow: 0 10px 30px rgba(0,0,0,0.8); 
    }

    .control-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 6px; font-weight: bold; color: #ffd700; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1.5px; }

    input[type="range"] { width: 100%; height: 10px; background: #151921; border-radius: 5px; outline: none; -webkit-appearance: none; }
    input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 28px; height: 28px; background: #ffd700; border-radius: 50%; box-shadow: 0 0 15px #ffd700; border: 2px solid #000; cursor: pointer; }

    select { width: 100%; padding: 14px; background: #000; color: #fff; border: 1px solid #333; border-radius: 12px; font-size: 0.9rem; font-weight: 600; outline: none; }

    .button-group { display: flex; gap: 12px; margin-top: 15px; }
    button { padding: 18px; border-radius: 14px; border: none; font-weight: 900; cursor: pointer; text-transform: uppercase; transition: 0.2s; }

    #start-btn { flex: 2; background: linear-gradient(135deg, #ffd700, #b38728); color: #000; }
    #stop-btn { flex: 1; background: #121212; color: #e94560; border: 1px solid #301010; }
    button:disabled { opacity: 0.15; pointer-events: none; }

    .game-area { 
      background: #040406; padding: 30px; border-radius: 30px; 
      text-align: center; border: 1px solid #111; min-height: 520px; 
      display: flex; flex-direction: column; justify-content: space-between;
      box-shadow: inset 0 0 60px rgba(0,0,0,0.9);
    }

    #countdown-box { font-size: 6rem; font-weight: 900; color: #ffd700; height: 120px; display: flex; align-items: center; justify-content: center; text-shadow: 0 0 30px rgba(255, 215, 0, 0.6); }

    .premise-display { 
      font-size: clamp(1.1rem, 5vw, 1.6rem); color: #fff; margin: 20px 0; font-style: italic; 
      min-height: 120px; display: flex; align-items: center; justify-content: center; 
      line-height: 1.6; text-shadow: 0 0 20px rgba(255,255,255,0.05); padding: 10px;
    }

    .response-buttons { display: flex; flex-direction: column; gap: 15px; width: 100%; }
    @media (min-width: 450px) { .response-buttons { flex-direction: row; } }
    .response-buttons button { flex: 1; padding: 30px 20px; font-size: 1.6rem; border: 2px solid transparent; border-radius: 20px; }

    #match-btn { background: rgba(46, 204, 113, 0.05); color: #2ecc71; border-color: rgba(46, 204, 113, 0.2); }
    #no-match-btn { background: rgba(231, 76, 60, 0.05); color: #e74c3c; border-color: rgba(231, 76, 60, 0.2); }
    #match-btn:active { background: #2ecc71; color: #000; }
    #no-match-btn:active { background: #e74c3c; color: #fff; }

    .timer-container { width: 100%; height: 6px; background: #111; margin-top: 15px; border-radius: 3px; overflow: hidden; }
    #timer-bar { width: 0%; height: 100%; background: #ffd700; }

    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 30px; }
    .stat-box { background: #08080c; padding: 15px; border-radius: 15px; border: 1px solid #111; }
    .stat-label { font-size: 0.55rem; color: #444; text-transform: uppercase; font-weight: 800; }
    .stat-value { font-size: 1.2rem; font-weight: 900; color: #bf953f; }
    #feedback { font-size: 1.4rem; font-weight: 900; min-height: 32px; letter-spacing: 2px; }
  </style>
</head>
<body>

<main class="container">
    <h1>IMAGI-WORLD</h1>
    
    <div class="controls">
        <div class="control-group">
            <label>N-Back Window: <span id="n-val" style="color:#ffd700">1</span></label>
            <input type="range" id="n-slider" min="1" max="5" value="1">
        </div>

        <div class="control-group">
            <label>Topology Geometry:</label>
            <select id="logic-mode">
                <option value="0">Mode 0: Standard Linear</option>
                <option value="1">Mode 1: Dialectical Superposition</option>
                <option value="2">Mode 2: Semantic Tensor</option>
                <option value="3">Mode 3: System Homology</option>
                <option value="4">Mode 4: Complementary Interface</option>
                <option value="5">Mode 5: Algebraic Relational Symmetry</option>
            </select>
        </div>

        <div class="control-group">
            <label>Thinking Window (Sec): <span id="spt-val" style="color:#ffd700">8.0</span>s</label>
            <input type="range" id="spt-slider" min="2" max="300" step="1" value="8">
        </div>

        <div class="button-group">
            <button id="start-btn">Initialize Link</button>
            <button id="stop-btn" disabled>Sever</button>
        </div>
    </div>

    <div class="game-area">
        <div id="feedback"></div>
        <div id="countdown-box"></div>
        <div id="premise-display">AWAITING_NEURAL_LINK</div>
        
        <div class="response-buttons">
            <button id="match-btn" disabled>MATCH</button>
            <button id="no-match-btn" disabled>NO_MATCH</button>
        </div>

        <div class="timer-container"><div id="timer-bar"></div></div>

        <div class="stats">
            <div class="stat-box"><div class="stat-label">Cycle</div><div id="trial-count" class="stat-value">0</div></div>
            <div class="stat-box"><div class="stat-label">Sync</div><div id="score" class="stat-value">0</div></div>
            <div class="stat-box"><div class="stat-label">Prec</div><div id="accuracy" class="stat-value">0%</div></div>
        </div>
    </div>
</main>

<script type="module">
    /**
     * IMAGI-WORLD TOPOLOGY ENGINE v9.0
     * - "A" Absolute Purge Protocol
     * - Mode 5 Algebraic Relational Symmetry (Truth-Value Matching)
     * - 300s Synthesis Budget
     * - Hardware-Wake Bluetooth Primer
     */
    
    const SYMBOLS = "BCDEFGHJKLMNOPQRSTUVWXYZ".split(""); 
    const REL = { N: 'north', S: 'south', E: 'east', W: 'west' };

    class Mulberry32 {
        constructor(seed) { this.state = seed >>> 0; }
        next() {
            let t = this.state += 0x6D2B79F5;
            t = Math.imul(t ^ t >>> 15, t | 1);
            t ^= t + Math.imul(t ^ t >>> 7, t | 61);
            return ((t ^ t >>> 14) >>> 0) / 4294967296;
        }
        choice(arr) { return arr[Math.floor(this.next() * arr.length)]; }
    }

    class DaVinciEngine {
        constructor() {
            this.history = []; this.score = 0; this.total = 0;
            this.running = false; this.rng = new Mulberry32(Date.now());
            this.synth = window.speechSynthesis;
            this.audioCtx = null;
        }

        init() {
            document.getElementById('start-btn').onclick = () => this.start();
            document.getElementById('stop-btn').onclick = () => this.stop();
            document.getElementById('n-slider').oninput = (e) => document.getElementById('n-val').textContent = e.target.value;
            document.getElementById('spt-slider').oninput = (e) => document.getElementById('spt-val').textContent = parseFloat(e.target.value).toFixed(1);
            document.getElementById('match-btn').onclick = () => this.respond(true);
            document.getElementById('no-match-btn').onclick = () => this.respond(false);

            window.addEventListener('keydown', (e) => {
                if (!this.running || this.answered) return;
                if (e.code === 'Space') { e.preventDefault(); this.respond(true); }
                if (e.code === 'Enter') { e.preventDefault(); this.respond(false); }
            });
        }

        sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

        initAudio() {
            if (!this.audioCtx) this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (this.audioCtx.state === 'suspended') this.audioCtx.resume();
        }

        playPrimer() {
            return new Promise((resolve) => {
                this.initAudio();
                const osc = this.audioCtx.createOscillator();
                const gain = this.audioCtx.createGain();
                osc.frequency.setValueAtTime(115, this.audioCtx.currentTime);
                gain.gain.setValueAtTime(0.06, this.audioCtx.currentTime);
                osc.connect(gain); gain.connect(this.audioCtx.destination);
                osc.start(); osc.stop(this.audioCtx.currentTime + 0.1);
                osc.onended = () => resolve();
            });
        }

        speak(text, rate = 0.88) {
            return new Promise((resolve) => {
                this.synth.cancel(); this.synth.resume();
                const utter = new SpeechSynthesisUtterance(text);
                utter.rate = rate; utter.pitch = 1.0;
                utter.onend = () => resolve();
                utter.onerror = () => resolve();
                setTimeout(resolve, 8000);
                this.synth.speak(utter);
            });
        }

        async runInitialCountdown() {
            const box = document.getElementById('countdown-box');
            await this.sleep(1000); // The required 1s pre-delay
            for (let i = 3; i > 0; i--) {
                box.textContent = i;
                this.speak(i.toString(), 1.2); 
                await this.sleep(1000); // Strict 1s rhythmic cadence
            }
            box.textContent = "";
        }

        getTransformationRule(d1, d2) {
            if (REL[d1] === REL[d2]) return "IDENTITY";
            const opposites = { N: 'S', S: 'N', E: 'W', W: 'E' };
            if (opposites[d1] === d2) return "INVERSION";
            return "ROTATION";
        }

        getOrtho(d) {
            const v = ['N', 'S'], h = ['E', 'W'];
            return v.includes(d) ? this.rng.choice(h) : this.rng.choice(v);
        }

        generate(mode, forceMatchKey = null) {
            const rS = () => this.rng.choice(SYMBOLS);
            const rD = () => this.rng.choice(['N', 'S', 'E', 'W']);
            let text, key;

            if (forceMatchKey) {
                key = forceMatchKey;
            } else {
                const d1 = rD(), d2 = rD(), d3 = rD(), d4 = rD();
                switch(parseInt(mode)) {
                    case 1: key = `M1-${[d1, this.getOrtho(d1)].sort().join('')}`; break;
                    case 2: key = `M2-${[d1, this.getOrtho(d1)].sort().join('')}`; break;
                    case 3: key = `M3-${d1}-${d2}`; break;
                    case 4: key = `M4-${rD()}${rD()}-${rD()}${rD()}-${rD()}`; break;
                    case 5: 
                        const rule1 = this.getTransformationRule(d1, d2);
                        const rule2 = this.getTransformationRule(d3, d4);
                        const truth = rule1 === rule2 ? "TRUE" : "FALSE";
                        key = `M5-${d1}${d2}-${d3}${d4}-${truth}`; 
                        break;
                    default: key = `M0-${d1}`;
                }
            }

            const p = key.split('-');
            const m = p[0];
            let s1 = rS(), s2 = rS(), s3 = rS();
            while(s2 === s1) s2 = rS();
            while(s3 === s1 || s3 === s2) s3 = rS();

            if (m === 'M1') text = `${s1} is ${REL[p[1][0]]} and ${REL[p[1][1]]} of ${s2}`;
            else if (m === 'M2') text = `${s1} is ${REL[p[1][0]]} of ${s2} and ${REL[p[1][1]]} of ${s3}`;
            else if (m === 'M3') text = `(${REL[p[1]]} of ${s1}) is ${REL[p[2]]} of (${REL[p[1]]} of ${s2})`;
            else if (m === 'M4') text = `(${REL[p[1][0]]}-${REL[p[1][1]]} of ${s1}) is ${REL[p[3]]} of (${REL[p[2][0]]}-${REL[p[2][1]]} of ${s2})`;
            else if (m === 'M5') {
                const s1_ = p[1].split(''), s2_ = p[2].split('');
                text = `${REL[s1_[0]]} to ${REL[s1_[1]]} of ${s1} as ${REL[s2_[0]]} to ${REL[s2_[1]]} of ${s2}`;
            }
            else text = `${s1} is ${REL[p[1]]} of ${s2}`;

            return { text, key };
        }

        async start() {
            this.synth.resume();
            this.running = true; this.score = 0; this.total = 0; this.history = [];
            document.getElementById('start-btn').disabled = true;
            document.getElementById('stop-btn').disabled = false;
            await this.runInitialCountdown();
            this.pulse();
        }

        stop() {
            this.running = false; clearTimeout(this.timer); this.synth.cancel();
            document.getElementById('start-btn').disabled = false;
            document.getElementById('stop-btn').disabled = true;
            document.getElementById('match-btn').disabled = true;
            document.getElementById('no-match-btn').disabled = true;
            document.getElementById('timer-bar').style.width = "0%";
            document.getElementById('countdown-box').textContent = "";
            document.getElementById('premise-display').textContent = "SEVERED";
        }

        async pulse() {
            if (!this.running) return;
            const mode = document.getElementById('logic-mode').value;
            const n = parseInt(document.getElementById('n-slider').value);
            const shouldMatch = this.history.length >= n && this.rng.next() < 0.35;
            const nBackObj = shouldMatch ? this.history[this.history.length - n] : null;
            
            let current;
            let safety = 0;
            do {
                current = this.generate(mode, nBackObj ? nBackObj.key : null);
                safety++;
            } while (this.history.length > 0 && current.text === this.history[this.history.length-1].text && safety < 10);

            // MODE 5 SPECIAL MATCH: Logic focuses on Truth Value (the last part of the key)
            if (mode == "5") {
                this.correctIsMatch = (nBackObj !== null && current.key.split('-')[3] === nBackObj.key.split('-')[3]);
            } else {
                this.correctIsMatch = (nBackObj !== null && current.key === nBackObj.key);
            }
            
            this.currentCycleObj = current;
            this.answered = true;

            document.getElementById('premise-display').textContent = current.text;
            document.getElementById('timer-bar').style.transition = 'none';
            document.getElementById('timer-bar').style.width = '0%';
            
            await this.playPrimer();
            await this.speak(current.text);

            if (!this.running) return;

            this.answered = false;
            document.getElementById('match-btn').disabled = false;
            document.getElementById('no-match-btn').disabled = false;
            
            const spt = parseFloat(document.getElementById('spt-slider').value);
            const bar = document.getElementById('timer-bar');
            bar.style.transition = `width ${spt}s linear`;
            bar.style.width = '100%';

            this.timer = setTimeout(() => { if (!this.answered) this.respond(null); }, spt * 1000);
        }

        respond(val) {
            if (this.answered || !this.running) return;
            this.answered = true; clearTimeout(this.timer);
            document.getElementById('match-btn').disabled = true;
            document.getElementById('no-match-btn').disabled = true;
            document.getElementById('timer-bar').style.transition = 'none';
            document.getElementById('timer-bar').style.width = '0%';

            const fb = document.getElementById('feedback');
            if (val === null) { fb.textContent = "TIMEOUT"; fb.className = "incorrect"; }
            else if (val === this.correctIsMatch) { this.score++; fb.textContent = "SYNC_OK"; fb.className = "correct"; }
            else { fb.textContent = "SYNC_FAIL"; fb.className = "incorrect"; }

            this.total++;
            this.updateUI();
            this.history.push(this.currentCycleObj);
            setTimeout(() => { fb.textContent = ""; if (this.running) this.pulse(); }, 1200);
        }

        updateUI() {
            document.getElementById('trial-count').textContent = this.total;
            document.getElementById('score').textContent = this.score;
            document.getElementById('accuracy').textContent = 
                this.total > 0 ? Math.round((this.score / this.total) * 100) + "%" : "0%";
        }
    }

    const engine = new DaVinciEngine();
    engine.init();
</script>
</body>
</html>
