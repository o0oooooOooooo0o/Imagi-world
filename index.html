<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🌀 IMAGI-WORLD: Recursive Homology 🌀</title>
  <style>
    :root {
      --gold: linear-gradient(to right, #bf953f 0%, #fcf6ba 20%, #b38728 40%, #fbf5b7 60%, #aa771c 80%, #bf953f 100%);
      --bg: #020205;
      --panel: #0a0e14;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: #eee;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 15px;
      overflow-x: hidden;
      touch-action: manipulation;
    }

    h1 {
      margin: 20px 0;
      font-size: clamp(1.8rem, 10vw, 3rem);
      text-align: center;
      letter-spacing: 5px;
      font-weight: 900;
      background: var(--gold);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.8));
      text-transform: uppercase;
      animation: shimmer 6s infinite linear;
      background-size: 200% auto;
    }

    @keyframes shimmer { to { background-position: 200% center; } }

    .container { max-width: 600px; width: 100%; }

    .controls {
      background: var(--panel);
      padding: 25px;
      border-radius: 20px;
      margin-bottom: 20px;
      border: 1px solid #222;
      box-shadow: 0 15px 35px rgba(0,0,0,0.8);
    }

    .control-group { margin-bottom: 18px; }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      color: #ffd700;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    input[type="range"] {
      width: 100%;
      height: 8px;
      background: #151921;
      border-radius: 4px;
      outline: none;
      -webkit-appearance: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 26px;
      height: 26px;
      background: #ffd700;
      border-radius: 50%;
      box-shadow: 0 0 15px #ffd700;
      border: 2px solid #000;
      cursor: pointer;
    }

    select {
      width: 100%;
      padding: 14px;
      background: #000;
      color: #fff;
      border: 1px solid #444;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 600;
      outline: none;
    }

    .button-group { display: flex; gap: 12px; margin-top: 15px; }

    button {
      padding: 18px;
      border-radius: 14px;
      border: none;
      font-weight: 900;
      cursor: pointer;
      transition: 0.2s;
      text-transform: uppercase;
      touch-action: manipulation;
    }

    #start-btn { flex: 2; background: linear-gradient(135deg, #ffd700, #b38728); color: #000; }
    #stop-btn { flex: 1; background: #121212; color: #e94560; border: 1px solid #401010; }
    button:disabled { opacity: 0.15; pointer-events: none; }

    .game-area {
      background: #050508;
      padding: 30px;
      border-radius: 30px;
      text-align: center;
      border: 1px solid #111;
      min-height: 480px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: inset 0 0 50px rgba(0,0,0,0.9);
      position: relative;
    }

    .status {
      font-size: 0.65rem;
      color: #444;
      letter-spacing: 5px;
      font-weight: 900;
      text-transform: uppercase;
    }

    #countdown-overlay {
      font-size: 6rem;
      color: #ffd700;
      font-weight: 900;
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: none;
      text-shadow: 0 0 40px #ffd700;
      z-index: 20;
    }

    .premise-display {
      font-size: clamp(0.9rem, 4vw, 1.3rem);
      color: #fff;
      margin: 20px 0;
      font-style: italic;
      min-height: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1.8;
      text-shadow: 0 0 20px rgba(255,255,255,0.05);
      padding: 15px;
    }

    .response-buttons { display: flex; flex-direction: column; gap: 15px; width: 100%; }
    @media (min-width: 500px) { .response-buttons { flex-direction: row; } }

    .response-buttons button {
      flex: 1;
      padding: 30px 20px;
      font-size: 1.5rem;
      border: 2px solid transparent;
      border-radius: 20px;
    }

    #match-btn { background: rgba(46, 204, 113, 0.05); color: #2ecc71; border-color: rgba(46, 204, 113, 0.2); }
    #no-match-btn { background: rgba(231, 76, 60, 0.05); color: #e74c3c; border-color: rgba(231, 76, 60, 0.2); }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 30px;
    }

    .stat-box {
      background: #0a0a0f;
      padding: 15px;
      border-radius: 15px;
      border: 1px solid #111;
    }

    .stat-label {
      font-size: 0.55rem;
      color: #444;
      text-transform: uppercase;
      margin-bottom: 5px;
      font-weight: 800;
    }

    .stat-value {
      font-size: 1.2rem;
      font-weight: 900;
      color: #bf953f;
    }

    #feedback { font-size: 1.4rem; font-weight: 900; min-height: 32px; letter-spacing: 2px; }
    .correct { color: #ffd700; text-shadow: 0 0 15px #ffd700; }
    .incorrect { color: #ff4444; }
  </style>
</head>
<body>
  <main class="container">
    <h1>IMAGI-WORLD</h1>

    <div class="controls">
      <div class="control-group">
        <label>N-Back Lag: <span id="n-val" style="color:#ffd700">1</span></label>
        <input type="range" id="n-slider" min="1" max="7" value="1">
      </div>

      <div class="control-group">
        <label>Topology Geometry:</label>
        <select id="logic-mode">
          <option value="0">Mode 0: Standard Linear</option>
          <option value="1">Mode 1: Dialectical Superposition</option>
          <option value="2">Mode 2: Semantic Tensor</option>
          <option value="3">Mode 3: System Homology</option>
          <option value="4">Mode 4: Complementary Interface</option>
          <option value="5">Mode 5: Recursive Tensor Homology</option>
        </select>
      </div>

      <div class="control-group">
        <label>Thinking Time: <span id="spt-val" style="color:#ffd700">8</span>s</label>
        <input type="range" id="spt-slider" min="2" max="300" step="1" value="8">
      </div>

      <div class="control-group">
        <label>Speech Rate: <span id="rate-val" style="color:#ffd700">0.85</span>x</label>
        <input type="range" id="rate-slider" min="0.5" max="2.0" step="0.05" value="0.85">
      </div>

      <div class="control-group">
        <label>Session Duration: <span id="session-val" style="color:#ffd700">20 min</span></label>
        <input type="range" id="session-slider" min="20" max="600" step="20" value="20">
      </div>

      <div class="button-group">
        <button id="start-btn">Initialize Session</button>
        <button id="stop-btn" disabled>Sever</button>
      </div>
    </div>

    <div class="game-area">
      <div id="status" class="status">SYSTEM STANDBY</div>
      <div id="countdown-overlay"></div>
      <div id="feedback"></div>
      <div id="premise-display" class="premise-display">INITIALIZE TO BEGIN</div>

      <div class="response-buttons">
        <button id="match-btn" disabled>MATCH</button>
        <button id="no-match-btn" disabled>NO MATCH</button>
      </div>

      <div class="stats">
        <div class="stat-box">
          <div class="stat-label">Cycle</div>
          <div id="trial-count" class="stat-value">0</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Score</div>
          <div id="score" class="stat-value">0</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Prec</div>
          <div id="accuracy" class="stat-value">0%</div>
        </div>
      </div>
    </div>
  </main>

<script type="module">
const SYMBOLS = "BCDEFGHJKLMNOPQRSTUVWXYZ".split("");
const REL = { N: 'north', S: 'south', E: 'east', W: 'west' };

class Mulberry32 {
  constructor(seed) { this.state = seed >>> 0; }
  next() {
    let t = this.state += 0x6D2B79F5;
    t = Math.imul(t ^ t >>> 15, t | 1);
    t ^= t + Math.imul(t ^ t >>> 7, t | 61);
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  }
  choice(arr) { return arr[Math.floor(this.next() * arr.length)]; }
}

class DaVinciEngine {
  constructor() {
    this.history = [];
    this.score = 0;
    this.total = 0;
    this.running = false;
    this.rng = new Mulberry32(Date.now());
    this.synth = window.speechSynthesis;
    this.audioCtx = null;
    this.answered = true;
    this.directionWindow = [];
  }

  init() {
    document.getElementById('start-btn').onclick = () => this.start();
    document.getElementById('stop-btn').onclick = () => this.stop();
    document.getElementById('n-slider').oninput = (e) => document.getElementById('n-val').textContent = e.target.value;
    document.getElementById('spt-slider').oninput = (e) => document.getElementById('spt-val').textContent = e.target.value;
    document.getElementById('rate-slider').oninput = (e) => document.getElementById('rate-val').textContent = parseFloat(e.target.value).toFixed(2);
    document.getElementById('session-slider').oninput = (e) => {
      const mins = parseInt(e.target.value);
      document.getElementById('session-val').textContent = mins >= 60 ? `${Math.floor(mins/60)} hr ${mins%60} min` : `${mins} min`;
    };
    document.getElementById('match-btn').onclick = () => this.respond(true);
    document.getElementById('no-match-btn').onclick = () => this.respond(false);

    window.addEventListener('keydown', (e) => {
      if (!this.running || this.answered) return;
      if (e.code === 'Space') { e.preventDefault(); this.respond(true); }
      if (e.code === 'Enter') { e.preventDefault(); this.respond(false); }
    });
  }

  initAudioContext() {
    if (!this.audioCtx) this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (this.audioCtx.state === 'suspended') this.audioCtx.resume();
  }

  playPrimer() {
    return new Promise((resolve) => {
      if (!this.audioCtx) return resolve();
      const osc = this.audioCtx.createOscillator();
      const gain = this.audioCtx.createGain();
      osc.frequency.setValueAtTime(110, this.audioCtx.currentTime);
      gain.gain.setValueAtTime(0.08, this.audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, this.audioCtx.currentTime + 0.12);
      osc.connect(gain); gain.connect(this.audioCtx.destination);
      osc.start(); osc.stop(this.audioCtx.currentTime + 0.12);
      setTimeout(resolve, 120);
    });
  }

  speakCountdown(text) {
    return new Promise((resolve) => {
      const u = new SpeechSynthesisUtterance(text);
      u.rate = 0.9; u.onend = u.onerror = resolve;
      this.synth.speak(u);
    });
  }

  speak(text) {
    return new Promise((resolve) => {
      this.synth.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.rate = parseFloat(document.getElementById('rate-slider').value);
      u.onend = u.onerror = resolve;
      this.synth.speak(u);
    });
  }

  async runInitialCountdown() {
    const overlay = document.getElementById('countdown-overlay');
    overlay.style.display = 'block';
    this.initAudioContext();
    await this.playPrimer();
    for (let i = 3; i > 0; i--) {
      if (!this.running) break;
      overlay.textContent = i;
      await this.speakCountdown(i.toString());
      await new Promise(r => setTimeout(r, 600));
    }
    overlay.style.display = 'none';
    if (this.running) await new Promise(r => setTimeout(r, 1000));
  }

  getBalancedDirection() {
    const dirs = ['N', 'S', 'E', 'W'];
    const recent = this.directionWindow.slice(-12);
    const counts = { N: 0, S: 0, E: 0, W: 0 };
    recent.forEach(d => counts[d]++);
    const max = Math.max(...Object.values(counts));
    const weights = dirs.map(d => max - counts[d] + 1);
    const total = weights.reduce((a, b) => a + b, 0);
    let r = this.rng.next() * total;
    for (let i = 0; i < dirs.length; i++) {
      r -= weights[i];
      if (r <= 0) return dirs[i];
    }
    return 'N';
  }

  getOrtho(d) {
    const v = ['N', 'S'], h = ['E', 'W'];
    const pool = v.includes(d) ? h : v;
    return this.rng.choice(pool);
  }

  generate(mode, forceMatchKey = null) {
    const rS = () => this.rng.choice(SYMBOLS);
    const rD = () => this.getBalancedDirection();
    const rP = () => rD() + rD();

    let text, key;
    if (forceMatchKey) {
      key = forceMatchKey;
    } else {
      const d1 = rD(), d2 = this.getOrtho(d1);
      const d3 = rD(), d4 = this.getOrtho(d3), d5 = rD();
      switch (parseInt(mode)) {
        case 1: key = `M1-${[d1, d2].sort().join('')}`; break;
        case 2: key = `M2-${[d1, d2].sort().join('')}`; break;
        case 3: key = `M3-${d1}-${rD()}-${d2}`; break;
        case 4: key = `M4-${rP()}-${rP()}-${rD()}`; break;
        case 5: key = `M5-${rP()}-${rP()}-${rD()}-${rP()}-${rP()}-${rD()}-${rD()}`; break;
        default: key = `M0-${d1}`;
      }
    }

    const p = key.split('-');
    const m = p[0];
    let s = []; while(s.length < 5) { let l = rS(); if(!s.includes(l)) s.push(l); }

    if (m === 'M1') text = `${s[0]} is ${REL[p[1][0]]} and ${REL[p[1][1]]} of ${s[1]}`;
    else if (m === 'M2') text = `${s[0]} is ${REL[p[1][0]]} of ${s[1]} and ${REL[p[1][1]]} of ${s[2]}`;
    else if (m === 'M3') text = `(${REL[p[1]]} of ${s[0]}) is ${REL[p[2]]} of (${REL[p[3]]} of ${s[1]})`;
    else if (m === 'M4') text = `(${REL[p[1][0]]}-${REL[p[1][1]]} of ${s[0]}) is ${REL[p[3]]} of (${REL[p[2][0]]}-${REL[p[2][1]]} of ${s[1]})`;
    else if (m === 'M5') {
        const left = `(${REL[p[1][0]]}-${REL[p[1][1]]} of ${s[0]}) is ${REL[p[3]]} of (${REL[p[2][0]]}-${REL[p[2][1]]} of ${s[1]})`;
        const right = `(${REL[p[4][0]]}-${REL[p[4][1]]} of ${s[2]}) is ${REL[p[6]]} of (${REL[p[5][0]]}-${REL[p[5][1]]} of ${s[3]})`;
        text = `[${left}] is ${REL[p[7]]} of [${right}]`;
    } else text = `${s[0]} is ${REL[p[1]]} of ${s[1]}`;

    return { text, key };
  }

  async start() {
    this.running = true; this.score = 0; this.total = 0; this.history = [];
    const mins = parseInt(document.getElementById('session-slider').value);
    this.sessionTimer = setTimeout(() => this.endSession(), mins * 60 * 1000);
    document.getElementById('start-btn').disabled = true;
    document.getElementById('stop-btn').disabled = false;
    await this.runInitialCountdown();
    if (this.running) this.pulse();
  }

  endSession() {
    this.running = false; clearTimeout(this.timer); this.synth.cancel();
    document.getElementById('start-btn').disabled = false;
    document.getElementById('stop-btn').disabled = true;
    document.getElementById('status').textContent = "SESSION COMPLETE";
  }

  stop() {
    this.running = false; clearTimeout(this.timer); clearTimeout(this.sessionTimer); this.synth.cancel();
    document.getElementById('start-btn').disabled = false;
    document.getElementById('stop-btn').disabled = true;
    document.getElementById('status').textContent = "LINK SEVERED";
  }

  async pulse() {
    if (!this.running) return;
    const mode = document.getElementById('logic-mode').value;
    const n = parseInt(document.getElementById('n-slider').value);
    const shouldMatch = this.history.length >= n && this.rng.next() < 0.38;
    const nBackObj = shouldMatch ? this.history[this.history.length - n] : null;
    let current = this.generate(mode, nBackObj ? nBackObj.key : null);
    this.correctIsMatch = (nBackObj !== null && current.key === nBackObj.key);
    this.currentCycleObj = current;
    this.answered = true;
    document.getElementById('premise-display').textContent = current.text;
    document.getElementById('match-btn').disabled = true;
    document.getElementById('no-match-btn').disabled = true;
    document.getElementById('status').textContent = "PRIMING AUDIO";
    await new Promise(r => setTimeout(r, 800));
    await this.playPrimer();
    await this.speak(current.text);
    if (!this.running) return;
    this.answered = false;
    document.getElementById('match-btn').disabled = false;
    document.getElementById('no-match-btn').disabled = false;
    document.getElementById('status').textContent = `CYCLE ${this.total + 1} PROCESSING`;
    this.timer = setTimeout(() => { if (!this.answered) this.respond(null); }, parseFloat(document.getElementById('spt-slider').value) * 1000);
  }

  respond(val) {
    if (this.answered || !this.running) return;
    this.answered = true; clearTimeout(this.timer);
    document.getElementById('match-btn').disabled = true;
    document.getElementById('no-match-btn').disabled = true;
    const fb = document.getElementById('feedback');
    if (val === null) fb.textContent = "TIMEOUT";
    else if (val === this.correctIsMatch) { this.score++; fb.textContent = "SYNC SUCCESS"; fb.className = "correct"; }
    else { fb.textContent = "SYNC ERROR"; fb.className = "incorrect"; }
    this.total++;
    this.updateUI();
    this.history.push(this.currentCycleObj);
    setTimeout(() => { fb.textContent = ""; fb.className = ""; if (this.running) this.pulse(); }, 1200);
  }

  updateUI() {
    document.getElementById('trial-count').textContent = this.total;
    document.getElementById('score').textContent = this.score;
    document.getElementById('accuracy').textContent = this.total > 0 ? Math.round((this.score/this.total)*100) + "%" : "0%";
  }
}
const engine = new DaVinciEngine();
engine.init();
</script>
</body>
</html>
